<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <!-- user-profile start -->
      <div class="user-profile">
        <div class="profile-header">
          <img src="./images/image-jeremy.png" alt="" />
          <p>Report for</p>
          <h3>Jeremy Robson</h3>
        </div>
        <nav class="profile-nav">
          <ul>
            <li><a href="#">Daily</a></li>
            <li class="active"><a href="#">Weekly </a></li>
            <li><a href="#">Montly</a></li>
          </ul>
        </nav>
      </div>
      <!-- user-profile end-->
      <!--time-history start -->
      <div class="time-history">
        <!--card start -->
        <div class="card work">
          <div class="card-body">
            <div class="card-header">
              <div class="header-title">Work</div>
              <div class="header-action">
                <img src="/images/icon-ellipsis.svg" alt="" srcset="" />
              </div>
            </div>
            <div class="card-content">32hrs</div>
            <div class="card-footer">last week -5hrs</div>
          </div>
        </div>
        <!--card end-->
        <!--card start -->
        <div class="card play">
          <div class="card-body">
            <div class="card-header">
              <div class="header-title">Play</div>
              <div class="header-action">
                <img src="/images/icon-ellipsis.svg" alt="" srcset="" />
              </div>
            </div>
            <div class="card-content">10hrs</div>
            <div class="card-footer">last week -5hrs</div>
          </div>
        </div>
        <!--card end-->
        <!--card start -->
        <div class="card study">
          <div class="card-body">
            <div class="card-header">
              <div class="header-title">Study</div>
              <div class="header-action">
                <img src="/images/icon-ellipsis.svg" alt="" srcset="" />
              </div>
            </div>
            <div class="card-content">4hrs</div>
            <div class="card-footer">last week -5hrs</div>
          </div>
        </div>
        <!--card end-->
        <!--card start -->
        <div class="card excercise">
          <div class="card-body">
            <div class="card-header">
              <div class="header-title">Excercise</div>
              <div class="header-action">
                <img src="/images/icon-ellipsis.svg" alt="" srcset="" />
              </div>
            </div>
            <div class="card-content">4hrs</div>
            <div class="card-footer">last week -5hrs</div>
          </div>
        </div>
        <!--card end-->
        <!--card start -->
        <div class="card social">
          <div class="card-body">
            <div class="card-header">
              <div class="header-title">Social</div>
              <div class="header-action">
                <img src="/images/icon-ellipsis.svg" alt="" srcset="" />
              </div>
            </div>
            <div class="card-content">5hrs</div>
            <div class="card-footer">last week -5hrs</div>
          </div>
        </div>
        <!--card end-->
        <!--card start -->
        <div class="card self-care">
          <div class="card-body">
            <div class="card-header">
              <div class="header-title">Self Care</div>
              <div class="header-action">
                <img src="/images/icon-ellipsis.svg" alt="" srcset="" />
              </div>
            </div>
            <div class="card-content">2hrs</div>
            <div class="card-footer">last week -5hrs</div>
          </div>
        </div>
        <!--card end-->
      </div>
      <!--time-history end -->
    </main>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Ojuoye Moshood Olawale</a>.
    </div>
  </body>
</html>
